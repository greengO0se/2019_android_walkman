name: Build Walkman Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and GCC-9 AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev lzop cpio gcc-9-aarch64-linux-gnu
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/aarch64-linux-gnu-gcc

      - name: Verify Compiler Exists
        run: |
          aarch64-linux-gnu-gcc --version

      - name: Build Kernel (KernelSU)
        run: |
          cd kernel_imx
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out android_dmp1_defconfig
          make O=out KCFLAGS="-Wno-error" -j$(nproc)

      - name: Upload compiled Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: a105-kernel-image
          path: kernel_imx/out/arch/arm64/boot/Image
